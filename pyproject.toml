[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "goldfish"
dynamic = ["version"]
requires-python = "==3.13.*"
dependencies = ["tomli-w", "PyYAML", "typer", "chonkie"]

[project.urls]
Homepage = "https://github.com/miztertea/goldfish"
Repository = "https://github.com/miztertea/goldfish"

[tool.hatch.version]
source = "vcs"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
goldfish = "goldfish.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/goldfish"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.9.0",
    "mypy>=1.0.0",
    "bandit[toml]>=1.7.0",
    "pip-audit>=2.7.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# init.py embeds long markdown strings — line length is intentional
"src/goldfish/init.py" = ["E501"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = false

[tool.bandit]
skips = ["B603", "B607"]
