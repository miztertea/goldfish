name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-caching: true
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/goldfish/
      - run: uv run bandit -r src/ -ll
      - run: uv run pip-audit

  claude-review:
    name: claude-review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

  test:
    name: test
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-caching: true
      - run: uv sync --group dev
      - run: uv run pytest

  matrix:
    name: matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-caching: true
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: Install dev dependencies
        shell: bash
        run: uv sync --group dev
      - name: Run test suite
        shell: bash
        run: uv run pytest
      - name: Build wheel
        shell: bash
        run: uv build
      - name: Install built wheel
        shell: bash
        run: uv tool install dist/goldfish-*.whl
      - name: Smoke test CLI
        shell: bash
        run: goldfish --help
      - name: Smoke test init
        shell: bash
        run: |
          goldfish init
          goldfish status
          goldfish doctor

  release:
    name: release
    runs-on: ubuntu-latest
    needs: matrix
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
      - name: Check for releasable commits
        id: check
        shell: bash
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          # Skip release if HEAD was committed by the release bot (prevents loops)
          LAST_AUTHOR=$(git log -1 --format='%ae')
          if [ "${LAST_AUTHOR}" = "github-actions[bot]@users.noreply.github.com" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Release commit detected — skipping release job"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - uses: orhun/git-cliff-action@v4
        if: steps.check.outputs.skip == 'false'
        id: cliff
        with:
          config: cliff.toml
          args: --bumped-version
        env:
          GITHUB_REPO: ${{ github.repository }}
      - uses: orhun/git-cliff-action@v4
        if: steps.check.outputs.skip == 'false'
        with:
          config: cliff.toml
          args: --bump -o CHANGELOG.md
        env:
          GITHUB_REPO: ${{ github.repository }}
      - name: Commit, tag, and push
        if: steps.check.outputs.skip == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          NEW_TAG: ${{ steps.cliff.outputs.version }}
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          if [ "${NEW_TAG}" = "${LAST_TAG}" ]; then
            echo "No releasable commits since ${LAST_TAG} — skipping tag creation"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --staged --quiet || git commit -m "chore: update changelog for ${NEW_TAG}"
          git tag "${NEW_TAG}"
          git push --follow-tags
          gh release create "${NEW_TAG}" \
            --title "${NEW_TAG}" \
            --notes-file CHANGELOG.md
