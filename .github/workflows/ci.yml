name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-caching: true
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/goldfish/
      - run: uv run bandit -r src/ -ll
      - run: uv run pip-audit

  test:
    name: test
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-caching: true
      - run: uv sync --group dev
      - run: uv run pytest

  matrix-windows:
    name: matrix (windows-latest)
    runs-on: windows-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.event.head_commit.author.email != 'github-actions[bot]@users.noreply.github.com'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-caching: true
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: Install dev dependencies
        shell: bash
        run: uv sync --group dev
      - name: Run test suite
        shell: bash
        run: uv run pytest
      - name: Build wheel
        shell: bash
        run: uv build
      - name: Install built wheel
        shell: bash
        run: uv tool install dist/goldfish-*.whl
      - name: Smoke test CLI
        shell: bash
        run: goldfish --help
      - name: Smoke test init
        shell: bash
        run: |
          goldfish init
          goldfish status
          goldfish doctor

  matrix-macos:
    name: matrix (macos-latest)
    runs-on: macos-latest
    needs: matrix-windows
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-caching: true
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: Install dev dependencies
        shell: bash
        run: uv sync --group dev
      - name: Run test suite
        shell: bash
        run: uv run pytest
      - name: Build wheel
        shell: bash
        run: uv build
      - name: Install built wheel
        shell: bash
        run: uv tool install dist/goldfish-*.whl
      - name: Smoke test CLI
        shell: bash
        run: goldfish --help
      - name: Smoke test init
        shell: bash
        run: |
          goldfish init
          goldfish status
          goldfish doctor

  release:
    name: release
    runs-on: ubuntu-latest
    needs: matrix-macos
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
      - name: Check for releasable commits
        id: check
        shell: bash
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          # Skip release if HEAD was committed by the release bot (prevents loops)
          LAST_AUTHOR=$(git log -1 --format='%ae')
          if [ "${LAST_AUTHOR}" = "github-actions[bot]@users.noreply.github.com" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Release commit detected — skipping release job"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - name: Compute next version
        if: steps.check.outputs.skip == 'false'
        id: version
        shell: bash
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          # Strip leading 'v' and split into components
          VERSION="${LAST_TAG#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          # Scan commits since last tag for conventional types
          COMMITS=$(git log "${LAST_TAG}..HEAD" --format='%s' 2>/dev/null || git log --format='%s')
          if echo "$COMMITS" | grep -qE '^feat(\(.+\))?!:|^fix(\(.+\))?!:|BREAKING CHANGE'; then
            NEW_TAG="v$((MAJOR + 1)).0.0"
          elif echo "$COMMITS" | grep -qE '^feat(\(.+\))?:'; then
            NEW_TAG="v${MAJOR}.$((MINOR + 1)).0"
          elif echo "$COMMITS" | grep -qE '^fix(\(.+\))?:'; then
            NEW_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          else
            echo "No releasable commits since ${LAST_TAG} — skipping release"
            echo "new_tag=" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "new_tag=${NEW_TAG}" >> $GITHUB_OUTPUT
          echo "last_tag=${LAST_TAG}" >> $GITHUB_OUTPUT
          echo "Computed next version: ${NEW_TAG} (from ${LAST_TAG})"
      - uses: orhun/git-cliff-action@v4
        if: steps.check.outputs.skip == 'false' && steps.version.outputs.new_tag != ''
        with:
          config: cliff.toml
          args: --tag ${{ steps.version.outputs.new_tag }} -o CHANGELOG.md
        env:
          GITHUB_REPO: ${{ github.repository }}
      - uses: orhun/git-cliff-action@v4
        if: steps.check.outputs.skip == 'false' && steps.version.outputs.new_tag != ''
        with:
          config: cliff.toml
          args: --tag ${{ steps.version.outputs.new_tag }} --latest -o release-notes.md
        env:
          GITHUB_REPO: ${{ github.repository }}
      - name: Commit, tag, and push
        if: steps.check.outputs.skip == 'false' && steps.version.outputs.new_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          NEW_TAG: ${{ steps.version.outputs.new_tag }}
          LAST_TAG: ${{ steps.version.outputs.last_tag }}
        run: |
          if [ "${NEW_TAG}" = "${LAST_TAG}" ]; then
            echo "No releasable commits since ${LAST_TAG} — skipping tag creation"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --staged --quiet || git commit -m "chore: update changelog for ${NEW_TAG}"
          git tag "${NEW_TAG}"
          git push --follow-tags
          gh release create "${NEW_TAG}" --notes-file release-notes.md
